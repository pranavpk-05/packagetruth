name: Dependency evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [package-lock.json]
  workflow_dispatch:
    inputs:
      scenario:
        description: Dependency policy demonstration
        required: true
        type: choice
        options: [allow, block]

permissions:
  contents: read

concurrency:
  group: dependency-evidence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the default nonblocking for partial coverage. Repositories can opt into failing closed.
      FAIL_ON: ${{ vars.PACKAGETRUTH_FAIL_ON || 'critical' }}
      FAIL_INCOMPLETE: ${{ vars.PACKAGETRUTH_FAIL_ON_INCOMPLETE || 'false' }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      POLICY_SCENARIO: ${{ inputs.scenario }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Only the trusted base enters the worktree. The PR contributes a single bounded Git blob.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build:core
      - name: Check changed npm releases
        shell: bash
        run: bash scripts/ci/dependency-evidence.sh
      - name: Save evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packagetruth-evidence
          path: ${{ runner.temp }}/packagetruth-evidence.json
          if-no-files-found: ignore
          retention-days: 7
