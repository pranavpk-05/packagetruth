name: Dependency evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [package-lock.json]

permissions:
  contents: read

concurrency:
  group: dependency-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the default nonblocking for partial coverage. Repositories can opt into failing closed.
      FAIL_ON: ${{ vars.PACKAGETRUTH_FAIL_ON || 'critical' }}
      FAIL_INCOMPLETE: ${{ vars.PACKAGETRUTH_FAIL_ON_INCOMPLETE || 'false' }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Only the trusted base enters the worktree. The PR contributes a single bounded Git blob.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build:core
      - name: Check changed npm releases
        shell: bash
        run: |
          if [[ ! "$FAIL_ON" =~ ^(info|low|medium|high|critical|off)$ ||
                ! "$FAIL_INCOMPLETE" =~ ^(true|false)$ ]]; then
            echo "::error::PackageTruth dependency policy settings are invalid."
            exit 2
          fi
          work="$(mktemp -d "$RUNNER_TEMP/packagetruth.XXXXXX")"
          trap 'rm -r -- "$work"' EXIT
          export EVIDENCE_FILE="$RUNNER_TEMP/packagetruth-evidence.json"

          incomplete() {
            echo "::warning::Dependency evidence is incomplete. $1"
            printf '\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$FAIL_INCOMPLETE" == true ]]; then exit 1; fi
            exit 0
          }

          copy_lock() {
            local ref="$1" mode size
            mode="$(git ls-tree "$ref" -- package-lock.json | cut -d' ' -f1)"
            [[ "$mode" == 100644 || "$mode" == 100755 ]] || return 1
            size="$(git cat-file -s "$ref:package-lock.json")" || return 1
            [[ "$size" =~ ^[0-9]+$ ]] && (( size <= 4194304 )) || return 1
            git cat-file blob "$ref:package-lock.json" > "$2"
          }

          copy_lock HEAD "$work/base.json" || incomplete 'The base lockfile is absent, oversized or unsupported.'
          node scripts/read-pr-lock.mjs "$work/head.json" || incomplete 'The proposed lockfile could not be read.'

          status=0
          node packages/cli/dist/index.js lock-check "$work/base.json" "$work/head.json" --fail-on "$FAIL_ON" > "$EVIDENCE_FILE" || status=$?
          if [[ ! -s "$EVIDENCE_FILE" ]]; then incomplete 'The lockfile checker could not produce evidence.'; fi
          node --input-type=module - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.EVIDENCE_FILE, 'utf8'));
          console.log('## PackageTruth dependency evidence');
          console.log('');
          console.log('- Changed locations evaluated: ' + report.results.length);
          console.log('- Unique release scans: ' + Object.keys(report.evidence).length);
          console.log('- Incomplete coverage: ' + report.incomplete);
          console.log('- Policy threshold met: ' + report.policyFailed);
          console.log('');
          console.log('Download the JSON artifact for checks, findings and review actions.');
          JS
          if [[ "$status" == 3 ]]; then
            echo "::error::PackageTruth reached the configured finding severity threshold."
            exit 1
          fi
          if [[ "$status" != 0 ]]; then incomplete 'One or more proposed dependency changes could not be fully inspected.'; fi
      - name: Save evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packagetruth-evidence
          path: ${{ runner.temp }}/packagetruth-evidence.json
          if-no-files-found: ignore
          retention-days: 7
